<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS PART 3</title>
    <style>
        .container{
            height: 600px;
            width: 80%;
            margin: 10px auto;
            border:2px solid seagreen;
            border-radius:15px;
            display: grid;
            /* grid-template-rows: 150px 150px 150px ;
            grid-template-columns: 150px 150px 150px ; */
            grid-template-rows: repeat(3,5fr);
            grid-template-columns: repeat(3,5fr) ;
            /* row-gap: 10vh;
            column-gap: 10vh; */
            grid-gap: 10vh;
            
            flex-direction: row;
            justify-content: space-evenly;
            flex-wrap: wrap;
            align-content: space-evenly;
        }
        h1{
            text-align: center;
        }
        .container div{
            /* height: 100px;
            width: 100px; */
            color: black;
            text-align: center;
            font-size: 50px;
            border:2px solid black;
            margin: 10px;
            display: flex;
            flex-direction: row;
            /* align-content:space-evenly; */
            justify-content:center;
            
            flex-wrap: wrap;
            align-items:center;
            background-color:gray;
            border-radius:15px;
        }
        .A{
            /* grid-column-start: 1;
            grid-column-end: 3; */
            grid-column: 1/4;
        }
    </style>
</head>
<body>
    <h1>Welcome</h1>
    <div class="container">
        <div class="A" >A</div>
        <div >B</div>
        <div >C</div>
        <div >D</div>
        <div>E</div>
        <div>F</div>
        <div>G</div>
        <div>H</div>
        <div>I</div>
    </div>
</body>
</html>
