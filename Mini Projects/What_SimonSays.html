<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  <title>What Simon Says?</title>
  <style>
    body {
      text-align: center;
      background-color: black;
      color: white;
    }

    .btns {
      width: 150px;
      height: 150px;
      border: 5px solid rgb(255, 255, 255);
      border-radius: 20%;
      margin: 0.95rem;
      box-shadow: 10px solid white;
    }

    .btn_container {
      display: flex;
      justify-content: center;

    }

    .c1 {
      background-color: cornflowerblue;
    }

    .c2 {
      background-color: rgb(255, 196, 0);
    }

    .c3 {
      background-color: rgba(75, 248, 75, 0.803);
    }

    .c4 {
      background-color: lightseagreen;
    }

    .c5 {
      background-color: crimson;
    }

    .c6 {
      background-color: mediumblue;
    }

    .c7 {
      background-color: deeppink;
    }

    .c8 {
      background-color: darkorchid;
    }

    .c9 {
      background-color: orange;
    }

    .flash {
      background-color: white;
    }

    #snackbar {
    display: none;
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 250px;
    background-color:rgba(58, 57, 57, 0.813) ;
    border:5px solid rgba(31, 81, 255, 0.9);
    box-shadow:0 0 20px rgba(31, 81, 255, 0.9) 0 0 20 rgba(31, 81, 255, 0.9) 0 0 20 rgba(31, 81, 255, 0.9);
    color: white;
    padding: 15px;
    font-weight: bold;
    font-size: 18px;
    transition: transform 0.3s ease-in-out, opacity 0.3s;
}
  </style>
</head>

<body>
  <h1>Simon Says</h1>
  <h2>Press any key to start</h2>

  <div class="btn_container">
    <div class="line-one">
      <div class="btns c1 cornflowerblue" id="cornflowerblue" type="button"></div>
      <div class="btns c2 yellow" id="yellow" type="button"></div>
      <div class="btns c3 green" id="green" type="button"></div>
    </div>
    <div class="line-two">
      <div class="btns c4 seagreen" id="seagreen" type="button"></div>
      <div class="btns c5 crimson" id="crimson" type="button"></div>
      <div class="btns c6 blue" id="blue" type="button"></div>
    </div>
    <div class="line-three">
      <div class="btns c7 pink" id="pink" type="button"></div>
      <div class="btns c8 orchid" id="orchid" type="button"></div>
      <div class="btns c9 orange" id="orange" type="button"></div>
    </div>
  </div>
  <div id="snackbar"  class="alert alert-primary text-center shadow-lg rounded-pill" role="alert" >Level Completed!</div>

  <script>
    let gameSeq = [];
    let userSeq = [];
    let colors = [
      "cornflowerblue",
      "yellow",
      "green",
      "seagreen",
      "crimson",
      "blue",
      "pink",
      "orchid",
      "orange",
    ];

    let started = false;
    let level = 0;
    let h2 = document.querySelector("h2");

    document.addEventListener("keypress", function () {
      if (started == false) {
        console.log("game started...");
        started = true;
        LevelUp();
      }
    });

    function btnFalsh(btn) {
      btn.classList.add("flash");
      setTimeout(() => {
        btn.classList.remove("flash");
      }, 200);
    }

    function showSnackbar() {
    let snackbar = document.getElementById("snackbar");
    snackbar.style.display = "block";
    snackbar.style.transform = "scale(1.1)";
    snackbar.style.opacity = "1";

    setTimeout(() => {
        snackbar.style.opacity = "0";
        snackbar.style.transform = "scale(0.9)";
        setTimeout(() => snackbar.style.display = "none", 500);
    }, 2000); // Hide after 2 seconds
}

    function LevelUp() {
      userSeq = [];
      if (level>0){
        showSnackbar();
      }
      level++;
      setTimeout(()=>{ h2.innerText = "Level " + `${level}`;
      let randInx = Math.floor(Math.random() * 9);
      let randColr = colors[randInx];
      let rand_btn = document.querySelector(`.${randColr}`);
      gameSeq.push(randColr);
      console.log(gameSeq);
      btnFalsh(rand_btn);
    },1000)
     
    }

    function checkAns() {
      console.log(` ${level} = current level`);
      let idx = userSeq.length - 1;

      if (userSeq[idx] === gameSeq[idx]) {
        console.log("Correct input so far...");

        if (userSeq.length === gameSeq.length) {
          console.log("Level complete!");

          setTimeout(LevelUp, 1000);
        }
      } else {
        console.log("Mismatch! Game Over.");

        h2.innerHTML = `Game Over! <br>Your score is ${level} <br> Press any key to start`;

        resetGame();
      }
    }

    function resetGame() {
      level = 0;
      gameSeq = [];
      userSeq = [];
      started = false;
    }

    function btnPressed() {
      let btn = this;
      btnFalsh(btn);
      let userColor = btn.getAttribute("id");
      userSeq.push(userColor);
      console.log(userSeq);
      checkAns();
    }

    
    let btns = document.querySelectorAll(".btns");
    btns.forEach((btn) => {
      btn.addEventListener("click", btnPressed);
    });
  </script>
</body>

</html>
